name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src tests

      - name: Run tests with pytest
        run: uv run pytest --cov=agentir --cov-report=term-missing

      - name: Run CLI smoke tests
        run: |
          uv run agentir version
          uv run agentir doctor
          uv run agentir capabilities
          uv run agentir validate examples/customer_support_langgraph.yaml
          uv run agentir inspect examples/customer_support_langgraph.yaml
          uv run agentir verify examples/customer_support_langgraph.yaml
